<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StyleMatch Appointment Booking</title>
  <style>
    * {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    color: white;
  }

  body {
    margin: 0;
    padding: 0;
    background: url('images/formbackground-image.png') no-repeat center center/cover;
  }

  .container {
    width: 95%;
    margin: 40px auto;
    padding: 0;
  }

  h2 {
    text-align: center;
    margin: 30px 0 20px;
    letter-spacing: 3px;
    font-size: 24px;
  }

  .header {
    background-color: rgba(0, 0, 0, 0.9);
    text-align: center;
    padding: 20px 0;
  }

  .header img {
    width: 50px;
    vertical-align: middle;
  }

  .header h1 {
    display: inline-block;
    margin: 0 10px;
    font-size: 32px;
  }

  .header p {
    margin: 5px 0 0;
    font-size: 18px;
    letter-spacing: 2px;
  }

  .form-group {
    display: flex;
    align-items: center;
    margin: 15px 0;
  }

  .form-group label {
    width: 150px;
    font-weight: bold;
    letter-spacing: 1px;
  }

  .form-group input,
  .form-group select {
    flex: 1;
    margin-right: 10px;
    padding: 8px 12px;
    background-color: transparent;
    border: 1px solid white;
    border-radius: 5px;
    color: white;
  }

  .form-row {
    display: flex;
    justify-content: space-between;
  }

  .form-row .form-group {
    flex: 1;
    margin-right: 10px;
  }

  .form-row .form-group:last-child {
    margin-right: 0;
  }

  .button-container {
    text-align: center;
    margin-top: 40px;
  }

  .button-container button {
    padding: 12px 40px;
    font-size: 16px;
    border: none;
    border-radius: 5px;
    background-color: white;
    color: black;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
  }

  select option {
    background-color: black;
    color: white;
  }

  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
    color: white;
    text-align: center;
    padding: 20px;
  }

  .overlay-content {
    background: rgba(255,255,255,0.05);
    border: 2px solid white;
    padding: 30px;
    border-radius: 10px;
    position: relative;
  }

  .close-btn {
    position: absolute;
    top: 10px;
    right: 15px;
    cursor: pointer;
    font-size: 18px;
  }

  .confetti-gif {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1001;
    display: none;
  }

  .confetti-gif img {
    width: 300px;
  }

  @media (max-width: 768px) {
    .form-row {
      flex-direction: column;
    }
    .form-row .form-group {
      margin-right: 0;
      width: 100%;
    }
    .header h1 {
      font-size: 24px;
    }
    .header p {
      font-size: 14px;
    }
    h2 {
      font-size: 20px;
    }
    .button-container button {
      padding: 10px 30px;
      font-size: 14px;
    }
  }
  
  /* Loading spinner */
  .spinner {
    display: none;
    margin: 10px auto;
    border: 4px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top: 4px solid #fff;
    width: 30px;
    height: 30px;
    animation: spin 1s linear infinite;
  }
  
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  
  .alert {
    padding: 10px;
    border-radius: 5px;
    margin: 10px 0;
    display: none;
    text-align: center;
    width: 100%;
  }
  
  .alert-success {
    background-color: rgba(0, 128, 0, 0.2);
    border: 1px solid green;
  }
  
  .alert-error {
    background-color: rgba(255, 0, 0, 0.2);
    border: 1px solid red;
  }
  </style>
</head>
<body>

<h2>APPOINTMENT BOOKING</h2>

<div class="header">
  <img src="images/logo.png" alt="logo">
  <h1>StyleMatch</h1>
  <p>UNISEX SALON</p>
</div>

<div class="container">
  <div class="alert alert-success" id="booking-success"></div>
  <div class="alert alert-error" id="booking-error"></div>

  <div class="form-row">
    <div class="form-group">
      <label>NAME :</label>
      <input type="text" id="firstName" placeholder="First Name">
      <input type="text" id="lastName" placeholder="Last Name">
    </div>
    <div class="form-group">
      <label>GENDER :</label>
      <select id="gender">
        <option value="">CHOOSE</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>MOBILE NO :</label>
      <input type="text" id="mobile" placeholder="+91">
    </div>
    <div class="form-group">
      <label>EMAIL :</label>
      <input type="email" id="email" placeholder="@gmail.com">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>SERVICE :</label>
      <select id="service">
        <option value="">Select Service</option>
        <option value="Men Hair style">Men Hair style</option>
        <option value="Women Hair style">Women Hair style</option>
        <option value="Beard Trim">Beard Trim</option>
        <option value="Hair treatment">Hair treatment</option>
        <option value="Skin treatment">Skin treatment</option>
      </select>
    </div>

    <div class="form-group">
      <label>DATE :</label>
      <select id="month"></select>
      <select id="day"></select>
      <select id="year"></select>
    </div>

    <div class="form-group">
      <label>TIME :</label>
      <select id="time">
        <option value="">CHOOSE</option>
        <option value="8-10 AM">8-10 AM</option>
        <option value="10-12 AM">10-12 AM</option>
        <option value="1-3 PM">1-3 PM</option>
        <option value="3-5 PM">3-5 PM</option>
        <option value="5-7 PM">5-7 PM</option>
        <option value="7-9 PM">7-9 PM</option>
        <option value="9-11 PM">9-11 PM</option>
      </select>
    </div>
  </div>

  <div class="button-container">
    <button id="book-button">BOOK APPOINTMENT</button>
    <div class="spinner" id="booking-spinner"></div>
  </div>

</div>

<div class="overlay" id="confirmation">
  <div class="overlay-content">
    <span class="close-btn" onclick="closeOverlay()">✖</span>

    <!-- Confetti GIF -->
    <div class="confetti-gif" id="confettiAnimation">
      <img src="images/confetti.gif" alt="Celebration">
    </div>

    <div id="confirmationMessage"></div>
  </div>
</div>

<!-- Include the API.js script -->
<script src="js/api.js"></script>
<script>
  // Populate Date Fields
  const today = new Date();
  const monthEl = document.getElementById('month');
  const dayEl = document.getElementById('day');
  const yearEl = document.getElementById('year');

  const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  months.forEach((m, i) => {
    const option = document.createElement('option');
    option.value = i;
    option.text = m;
    if (i === today.getMonth()) option.selected = true;
    monthEl.appendChild(option);
  });

  function populateDays() {
    dayEl.innerHTML = '';
    const year = parseInt(yearEl.value);
    const month = parseInt(monthEl.value);
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
      const option = document.createElement('option');
      option.text = d;
      option.value = d;
      if (d === today.getDate()) option.selected = true;
      dayEl.appendChild(option);
    }
  }

  for (let y = today.getFullYear(); y <= today.getFullYear() + 1; y++) {
    const option = document.createElement('option');
    option.text = y;
    option.value = y;
    if (y === today.getFullYear()) option.selected = true;
    yearEl.appendChild(option);
  }

  monthEl.onchange = populateDays;
  yearEl.onchange = populateDays;
  populateDays();

  // Booking Appointment
  document.getElementById('book-button').addEventListener('click', async function() {
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const gender = document.getElementById('gender').value;
    const mobile = document.getElementById('mobile').value.trim();
    const email = document.getElementById('email').value.trim();
    const service = document.getElementById('service').value;
    const time = document.getElementById('time').value;
    
    const bookingSuccess = document.getElementById('booking-success');
    const bookingError = document.getElementById('booking-error');
    const bookingSpinner = document.getElementById('booking-spinner');
    
    // Reset messages
    bookingSuccess.style.display = 'none';
    bookingError.style.display = 'none';

    // Validation
    if (!firstName || !lastName || gender === "" || !mobile || !email ||
        service === "" || time === "") {
      bookingError.textContent = "Please fill out all fields and make proper selections before booking your appointment.";
      bookingError.style.display = 'block';
      return;
    }

    // Format date as YYYY-MM-DD for API
    const month = parseInt(monthEl.value) + 1;
    const day = dayEl.value;
    const year = yearEl.value;
    const formattedDate = `${year}-${month.toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
    const displayDate = `${months[monthEl.value]} ${day}, ${year}`;
    
    // Show spinner
    bookingSpinner.style.display = 'block';
    
    try {
      // Create appointment data
      const appointmentData = {
        firstName,
        lastName,
        gender,
        mobile,
        email,
        service,
        appointmentDate: formattedDate,
        appointmentTime: time
      };
      
      // Call API
      const response = await window.styleMatchAPI.appointments.bookRegular(appointmentData);
      
      // Hide spinner
      bookingSpinner.style.display = 'none';
      
      if (response.success) {
        // Show success message
        bookingSuccess.textContent = 'Appointment booked successfully!';
        bookingSuccess.style.display = 'block';
        
        // Display confirmation message
        const name = `${firstName} ${lastName}`;
        const message = `
          <h3>Thanks ${name}!!!</h3>
          <p>Your appointment for <strong>${service}</strong> has been successfully confirmed!</p>
          <p>We look forward to seeing you on <strong>${displayDate}</strong> at <strong>${time}</strong>.</p>
          <p>For any changes or inquiries, contact us at <strong>+1 (646) 555-7890</strong>.</p>
          <p>Thank you for choosing <strong>StyleMatch</strong>.</p>
        `;

        document.getElementById('confirmationMessage').innerHTML = message;
        document.getElementById('confirmation').style.display = 'flex';

        // Show Confetti Animation
        const confetti = document.getElementById('confettiAnimation');
        confetti.style.display = 'block';
        setTimeout(() => {
          confetti.style.display = 'none';
        }, 2000);
        
        // Reset form
        document.getElementById('firstName').value = '';
        document.getElementById('lastName').value = '';
        document.getElementById('gender').value = '';
        document.getElementById('mobile').value = '';
        document.getElementById('email').value = '';
        document.getElementById('service').value = '';
        document.getElementById('time').value = '';
      } else {
        // Show error message
        bookingError.textContent = response.message || 'Failed to book appointment. Please try again.';
        bookingError.style.display = 'block';
      }
    } catch (error) {
      // Hide spinner
      bookingSpinner.style.display = 'none';
      
      console.error('Booking error:', error);
      bookingError.textContent = 'An error occurred while booking your appointment. Please try again.';
      bookingError.style.display = 'block';
    }
  });

  function closeOverlay() {
    document.getElementById('confirmation').style.display = 'none';
    document.getElementById('confettiAnimation').style.display = 'none';
  }
  
  // Check if user is logged in and pre-fill form
  document.addEventListener('DOMContentLoaded', function() {
    if (window.styleMatchAPI.auth.isAuthenticated()) {
      const user = window.styleMatchAPI.auth.getCurrentUser();
      
      if (user) {
        // Pre-fill form with user information
        document.getElementById('firstName').value = user.firstName || '';
        document.getElementById('lastName').value = user.lastName || '';
        document.getElementById('gender').value = user.gender || '';
        document.getElementById('mobile').value = user.mobile || '';
        document.getElementById('email').value = user.email || '';
      }
    }
  });
</script>

</body>
</html>
