<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StyleMatch - Login/Signup</title>
  <style>* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
  }
  
  body, html {
    height: 100%;
    width: 100%;
    overflow: hidden;
  }
  h2 {
    text-align: center;
  }
  
  .container {
    display: flex;
    height: 100vh;
    width: 100vw;
  }
  
  .left-pane {
    width: 30%;
    background-color: #000;
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  
  .logo {
    width: 60px;
    height: 60px;
    margin-bottom: 10px;
  }
  
  .brand-text {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 5px;
  }
  
  .sub-text {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 20px;
  }
  
  .description {
    font-size: 13px;
    text-align: center;
    line-height: 1.4;
  }
  
  .right-pane {
    width: 70%;
    background: url('images/image.png') no-repeat center center;
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  
  /* Glassmorphism Effect */
  .form-box {
    background: rgba(255, 255, 255, 0.1); 
    backdrop-filter: blur(12px);          
    -webkit-backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 40px;
    color: #fff;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.3);
    text-align: center;
  }
  
  .form-section {
    display: none;
    flex-direction: column;
  }
  
  input, select {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 20px;
    border: none;
    outline: none;
  }
  
  button {
    width: 100%;
    padding: 10px;
    background-color: #000;
    color: #fff;
    font-weight: bold;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    margin-top: 10px;
  }
  
  .link {
    color: #00aaff;
    cursor: pointer;
    font-size: 13px;
    display: inline-block;
    margin-top: 5px;
  }
  
  .text-center {
    text-align: center;
    font-size: 13px;
    margin-top: 10px;
  }
  
  .info {
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 10px;
  }
  
  .tagline {
    margin-top: 15px;
    font-size: 13px;
    text-align: center;
    color: #eee;
  }
  @media screen and (max-width: 1024px) {
    .container {
      flex-direction: column;
      height: auto;
    }
  
    .left-pane,
    .right-pane {
      width: 100%;
      height: auto;
      padding: 30px 20px;
    }
  
    .left-pane {
      align-items: center;
    }
  
    .form-box {
      max-width: 90%;
      margin: auto;
    }
  
    .logo {
      width: 50px;
      height: 50px;
    }
  }
  
  /* For mobile devices (up to 600px wide) */
  @media screen and (max-width: 600px) {
    .container {
      flex-direction: column;
      height: auto;
    }
  
    .left-pane,
    .right-pane {
      width: 100%;
      height: auto;
      padding: 20px;
    }
  
    .brand-text {
      font-size: 20px;
    }
  
    .sub-text {
      font-size: 12px;
    }
  
    .description {
      font-size: 12px;
    }
  
    .form-box {
      padding: 20px;
      font-size: 14px;
    }
  
    input, select, button {
      font-size: 14px;
      padding: 8px;
    }
  
    .tagline {
      font-size: 12px;
    }
  }
  
  /* For large screens / Smart TVs (over 1440px) */
  @media screen and (min-width: 1440px) {
    .logo {
      width: 100px;
      height: 100px;
    }
  
    .brand-text {
      font-size: 32px;
    }
  
    .sub-text {
      font-size: 18px;
    }
  
    .description {
      font-size: 16px;
    }
  
    .form-box {
      max-width: 500px;
      padding: 60px;
      font-size: 18px;
    }
  
    input, select, button {
      font-size: 18px;
      padding: 15px;
    }
  
    .tagline {
      font-size: 16px;
    }
  }
  
  /* Radio control for forms */
  #loginView:checked ~ .form-box .login,
  #signupView:checked ~ .form-box .signup,
  #forgotView:checked ~ .form-box .forgot {
    display: flex;
  }
  
  /* Loading spinner */
  .spinner {
    display: none;
    margin: 10px auto;
    border: 4px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top: 4px solid #fff;
    width: 30px;
    height: 30px;
    animation: spin 1s linear infinite;
  }
  
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  
  .alert {
    padding: 10px;
    border-radius: 5px;
    margin: 10px 0;
    display: none;
  }
  
  .alert-success {
    background-color: rgba(0, 128, 0, 0.2);
    border: 1px solid green;
  }
  
  .alert-error {
    background-color: rgba(255, 0, 0, 0.2);
    border: 1px solid red;
  }

  </style>
</head>
<body>
  <div class="container">
    <div class="left-pane">
      <img src="images/logo.png" alt="Logo" class="logo"/>
      <div class="brand-text">STYLEMATCH</div>
      <div class="sub-text">UNISEX SALON</div>
      <div class="description">
        Your gateway to premium beauty and grooming services.
      </div>
    </div>

    <div class="right-pane">
      <input type="radio" name="view" id="loginView" checked hidden>
      <input type="radio" name="view" id="signupView" hidden>
      <input type="radio" name="view" id="forgotView" hidden>

      <div class="form-box">
        <!-- Login Form -->
        <div class="form-section login">
          <h2>LOGIN</h2>
          <div class="alert alert-success" id="login-success"></div>
          <div class="alert alert-error" id="login-error"></div>
          <input type="email" id="login-email" placeholder="Email">
          <input type="password" id="login-password" placeholder="Password">
          <label for="forgotView" class="link">Forgot Password?</label>
          <button id="login-btn">LOGIN</button>
          <div class="spinner" id="login-spinner"></div>
          <p class="text-center">Don't have an account? <label for="signupView" class="link">Sign Up Now</label></p>
        </div>

        <!-- Signup Form -->
        <div class="form-section signup">
          <h2>SIGN UP</h2>
          <div class="alert alert-success" id="signup-success"></div>
          <div class="alert alert-error" id="signup-error"></div>
          <input type="text" id="signup-first-name" placeholder="First Name">
          <input type="text" id="signup-last-name" placeholder="Last Name">
          <input type="email" id="signup-email" placeholder="Email">
          <select id="signup-gender">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
          <input type="text" id="signup-mobile" placeholder="Mobile Number">
          <input type="password" id="signup-password" placeholder="New Password">
          <input type="password" id="signup-confirm-password" placeholder="Confirm Password">
          <button id="signup-btn">SIGN UP</button>
          <div class="spinner" id="signup-spinner"></div>
          <p class="text-center">Already have an account? <label for="loginView" class="link">Login</label></p>
        </div>

        <!-- Forgot Password Form -->
        <div class="form-section forgot">
          <h2>Reset Password</h2>
          <div class="alert alert-success" id="forgot-success"></div>
          <div class="alert alert-error" id="forgot-error"></div>
          <p class="info">Enter your email to receive a reset link.</p>
          <input type="email" id="forgot-email" placeholder="Enter Your Email ID Here">
          <button id="forgot-btn">Send reset link</button>
          <div class="spinner" id="forgot-spinner"></div>
          <p class="text-center"><label for="loginView" class="link">← All login options</label></p>
        </div>

        <div class="text-center tagline">Your beauty journey begins here!</div>
      </div>
    </div>
  </div>

  <!-- Include the API.js script -->
  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Check if user is already logged in
      if (window.styleMatchAPI.auth.isAuthenticated()) {
        const user = window.styleMatchAPI.auth.getCurrentUser();
        if (user.role === 'admin') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'index.html';
        }
      }
      
      // Login Form
      const loginForm = document.getElementById('login-btn');
      const loginSpinner = document.getElementById('login-spinner');
      const loginSuccess = document.getElementById('login-success');
      const loginError = document.getElementById('login-error');
      
      loginForm.addEventListener('click', async function() {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        
        // Validation
        if (!email || !password) {
          loginError.textContent = 'Please enter email and password';
          loginError.style.display = 'block';
          return;
        }
        
        // Reset messages
        loginSuccess.style.display = 'none';
        loginError.style.display = 'none';
        
        // Show spinner
        loginSpinner.style.display = 'block';
        
        try {
          // Call API
          const response = await window.styleMatchAPI.auth.login(email, password);
          
          // Hide spinner
          loginSpinner.style.display = 'none';
          
          if (response.success) {
            loginSuccess.textContent = 'Login successful! Redirecting...';
            loginSuccess.style.display = 'block';
            
            // Redirect based on role
            setTimeout(() => {
              if (response.user.role === 'admin') {
                window.location.href = 'admin.html';
              } else {
                window.location.href = 'index.html';
              }
            }, 1000);
          } else {
            loginError.textContent = response.message || 'Login failed';
            loginError.style.display = 'block';
          }
        } catch (error) {
          // Hide spinner
          loginSpinner.style.display = 'none';
          
          loginError.textContent = 'An error occurred. Please try again.';
          loginError.style.display = 'block';
          console.error('Login error:', error);
        }
      });
      
      // Signup Form
      const signupForm = document.getElementById('signup-btn');
      const signupSpinner = document.getElementById('signup-spinner');
      const signupSuccess = document.getElementById('signup-success');
      const signupError = document.getElementById('signup-error');
      
      signupForm.addEventListener('click', async function() {
        const firstName = document.getElementById('signup-first-name').value;
        const lastName = document.getElementById('signup-last-name').value;
        const email = document.getElementById('signup-email').value;
        const gender = document.getElementById('signup-gender').value;
        const mobile = document.getElementById('signup-mobile').value;
        const password = document.getElementById('signup-password').value;
        const confirmPassword = document.getElementById('signup-confirm-password').value;
        
        // Validation
        if (!firstName || !lastName || !email || !gender || !password) {
          signupError.textContent = 'Please fill in all required fields';
          signupError.style.display = 'block';
          return;
        }
        
        if (password !== confirmPassword) {
          signupError.textContent = 'Passwords do not match';
          signupError.style.display = 'block';
          return;
        }
        
        // Reset messages
        signupSuccess.style.display = 'none';
        signupError.style.display = 'none';
        
        // Show spinner
        signupSpinner.style.display = 'block';
        
        try {
          // Call API
          const response = await window.styleMatchAPI.auth.register({
            firstName,
            lastName,
            email,
            gender,
            mobile,
            password
          });
          
          // Hide spinner
          signupSpinner.style.display = 'none';
          
          if (response.success) {
            signupSuccess.textContent = 'Registration successful! Redirecting to login...';
            signupSuccess.style.display = 'block';
            
            // Redirect to login
            setTimeout(() => {
              document.getElementById('loginView').checked = true;
            }, 2000);
          } else {
            signupError.textContent = response.message || 'Registration failed';
            signupError.style.display = 'block';
          }
        } catch (error) {
          // Hide spinner
          signupSpinner.style.display = 'none';
          
          signupError.textContent = 'An error occurred. Please try again.';
          signupError.style.display = 'block';
          console.error('Signup error:', error);
        }
      });
      
      // Forgot Password Form
      const forgotForm = document.getElementById('forgot-btn');
      const forgotSpinner = document.getElementById('forgot-spinner');
      const forgotSuccess = document.getElementById('forgot-success');
      const forgotError = document.getElementById('forgot-error');
      
      forgotForm.addEventListener('click', async function() {
        const email = document.getElementById('forgot-email').value;
        
        // Validation
        if (!email) {
          forgotError.textContent = 'Please enter your email';
          forgotError.style.display = 'block';
          return;
        }
        
        // Reset messages
        forgotSuccess.style.display = 'none';
        forgotError.style.display = 'none';
        
        // Show spinner
        forgotSpinner.style.display = 'block';
        
        try {
          // Call API
          const response = await window.styleMatchAPI.auth.forgotPassword(email);
          
          // Hide spinner
          forgotSpinner.style.display = 'none';
          
          if (response.success) {
            forgotSuccess.textContent = 'Reset link sent to your email!';
            forgotSuccess.style.display = 'block';
          } else {
            forgotError.textContent = response.message || 'Failed to send reset link';
            forgotError.style.display = 'block';
          }
        } catch (error) {
          // Hide spinner
          forgotSpinner.style.display = 'none';
          
          forgotError.textContent = 'An error occurred. Please try again.';
          forgotError.style.display = 'block';
          console.error('Forgot password error:', error);
        }
      });
    });
  </script>
</body>
</html>
